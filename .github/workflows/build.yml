name: Build EraOfWheel Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List Refs
        shell: pwsh
        run: |
          Write-Host "Refs directory: $env:GITHUB_WORKSPACE\EraOfWheel\Refs"
          if (Test-Path "$env:GITHUB_WORKSPACE\EraOfWheel\Refs") {
            Get-ChildItem -Path "$env:GITHUB_WORKSPACE\EraOfWheel\Refs" -File | Format-Table -AutoSize
          } else {
            Write-Host "Refs directory not found"
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build (Release)
        run: msbuild EraOfWheel\EraOfWheel.csproj /restore /p:Configuration=Release

      - name: List dist
        shell: pwsh
        run: |
          Write-Host "Dist directory: $env:GITHUB_WORKSPACE\EraOfWheel\dist"
          if (Test-Path "$env:GITHUB_WORKSPACE\EraOfWheel\dist") {
            Get-ChildItem -Path "$env:GITHUB_WORKSPACE\EraOfWheel\dist" -Recurse | Select-Object FullName,Length | Format-Table -AutoSize
          } else {
            Write-Host "Dist directory not found"
          }

      - name: Upload mod package
        uses: actions/upload-artifact@v4
        with:
          name: EraOfWheel-dist
          path: EraOfWheel\dist\EraOfWheel\
          if-no-files-found: error
