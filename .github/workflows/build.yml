name: Build EraOfWheel Mod

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build (Release)
        run: msbuild EraOfWheel\EraOfWheel.csproj /restore /p:Configuration=Release

      - name: Upload mod package
        uses: actions/upload-artifact@v4
        with:
          name: EraOfWheel-dist
          path: EraOfWheel\dist\EraOfWheel\
          if-no-files-found: error
