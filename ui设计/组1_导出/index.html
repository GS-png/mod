  <style>
    :root {
      --scale: 1;
      --paper: #16110d;
      --text: #ddd4bb;
      --gold: #e7b85b;
      --muted: #b9ad90;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background:
        radial-gradient(circle at 20% 10%, rgba(107, 58, 25, 0.35), transparent 36rem),
        radial-gradient(circle at 85% 75%, rgba(32, 71, 68, 0.32), transparent 32rem),
        #0c0a08;
      color: var(--text);
      font-family: "Microsoft YaHei", "SimSun", sans-serif;
      overflow: hidden;
    }

    body {
      display: grid;
      place-items: center;
    }

    #wrap {
      width: calc(1040px * var(--scale));
      height: calc(1100px * var(--scale));
      position: relative;
    }

    #stage {
      position: absolute;
      left: 0;
      top: 0;
      width: 1040px;
      height: 1100px;
      overflow: hidden;
      transform: scale(var(--scale));
      transform-origin: top left;
      background: rgba(20, 15, 11, 0.12);
    }

    .node {
      position: absolute;
      transform-origin: top left;
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }

    .frame, .rectangle, .ellipse { overflow: visible; }
    .clip { overflow: hidden; }
    .clip.scrollable {
      overflow: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .clip.scrollable::-webkit-scrollbar {
      width: 0;
      height: 0;
    }
    .clip.scrollable:focus-visible {
      outline: 2px solid rgba(241, 217, 135, 0.75);
      outline-offset: -2px;
    }
    .ellipse { border-radius: 999px; }
    .text { pointer-events: none; }

    .hit {
      position: absolute;
      border: 0;
      padding: 0;
      margin: 0;
      background: transparent;
      color: transparent;
      cursor: pointer;
      z-index: 8000;
    }

    .hit:focus-visible {
      outline: 3px solid rgba(241, 217, 135, 0.85);
      outline-offset: -3px;
      border-radius: 10px;
    }

    .modal-layer {
      position: absolute;
      inset: 0;
      z-index: 9000;
      background: rgba(0, 0, 0, 0.52);
      backdrop-filter: blur(2px);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>

                  "textGrowth": "fixed-width",

                  "content": "魔王系统负责魔王实体、技能行为、多魔王互动和据点配套。\n它像整轮战役的敌方核心，让世界从备战走向真正决战。\n玩家主要通过这里查看本轮魔王、互动关系、据点状态和降临压力。",

                  "textGrowth": "fixed-width",
                  "width": 576,
                  "content": "1. 预兆：系统先确定本轮魔王名单，并为每名魔王生成据点。\n2. 苏醒：将领先上场，魔王封印开始衰减。\n3. 降临：魔王封印归零后，魔王实体出现并主动进攻。\n4. 战后重建：本轮魔王状态、据点和互动关系被清理。",

    function renderNode(node, parent) {
      const el = document.createElement(node.type === 'text' ? 'div' : 'div');
      el.className = 'node ' + node.type + (node.clip ? ' clip' : '');
      el.style.left = px(node.x);
      el.style.top = px(node.y);
      if (node.width !== undefined) el.style.width = px(node.width);
      if (node.height !== undefined) el.style.height = px(node.height);
      if (node.opacity !== undefined) el.style.opacity = node.opacity;
      if (node.rotation) el.style.transform = `rotate(${-Number(node.rotation)}deg)`;
      applyFill(el, node.fill, node.type);
      applyStroke(el, node.stroke);
      applyEffect(el, node.effect);
      if (node.cornerRadius !== undefined) el.style.borderRadius = Array.isArray(node.cornerRadius) ? node.cornerRadius.map(px).join(' ') : px(node.cornerRadius);
      if (node.type === 'ellipse') el.classList.add('ellipse');
      if (node.type === 'text') applyText(el, node);
      parent.appendChild(el);
      if (node.action) addHit(node, parent);
      layoutChildren(node).forEach(child => renderNode(child, el));
      applyScrollable(el, node);
      return el;
    }

    function applyScrollable(el, node) {
      if (!node.clip) return;
      const name = node.name || '';
      const isScrollViewport = name.includes('\u6eda\u52a8\u89c6\u53e3');
      const isContentContainer = name.includes('\u5185\u5bb9\u5bb9\u5668');
      if (!isScrollViewport && !isContentContainer) return;

      const enableIfNeeded = () => {
        const hasOverflow = el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1;
        if (!isScrollViewport && !hasOverflow) return;
        el.classList.add('scrollable');
        el.tabIndex = 0;
        el.setAttribute('aria-label', name || 'scrollable content');
      };

      enableIfNeeded();
      if (typeof requestAnimationFrame === 'function') requestAnimationFrame(enableIfNeeded);
    }

    function layoutChildren(node) {
      const children = node.children || [];
      if (!children.length || !['frame', 'group'].includes(node.type)) return children;
      if (!node.alignItems && !node.justifyContent && !node.layout && node.gap == null && node.padding == null) return children;
      const parentWidth = Number(node.width);
      const parentHeight = Number(node.height);
      if (!Number.isFinite(parentWidth) || !Number.isFinite(parentHeight)) return children;

      const isVertical = node.layout === 'vertical';
      const gap = Number(node.gap) || 0;
      const padding = normalizePadding(node.padding);
      const contentWidth = parentWidth - padding.left - padding.right;
      const contentHeight = parentHeight - padding.top - padding.bottom;
      const mainSize = isVertical ? contentHeight : contentWidth;
      const crossSize = isVertical ? contentWidth : contentHeight;
      const flowChildren = children.filter(child => child.x == null && child.y == null && Number.isFinite(Number(child.width)) && Number.isFinite(Number(child.height)));
      const totalMain = flowChildren.reduce((sum, child) => sum + Number(isVertical ? child.height : child.width), 0) + Math.max(0, flowChildren.length - 1) * gap;
      let cursor = isVertical ? padding.top : padding.left;
      if (node.justifyContent === 'center') cursor += (mainSize - totalMain) / 2;

      return children.map(child => {
        if (child.x != null || child.y != null || !Number.isFinite(Number(child.width)) || !Number.isFinite(Number(child.height))) return child;
        const width = Number(child.width);
        const height = Number(child.height);
        const crossChildSize = isVertical ? width : height;
        const crossStart = isVertical ? padding.left : padding.top;
        const cross = node.alignItems === 'center' ? crossStart + (crossSize - crossChildSize) / 2 : crossStart;
        const copy = { ...child };
        if (isVertical) {
          copy.x = cross;
          copy.y = cursor;
          cursor += height + gap;
        } else {
          copy.x = cursor;
          copy.y = cross;
          cursor += width + gap;
        }
        return copy;
      });
    }

    function normalizePadding(value) {
      if (Array.isArray(value)) {
        const values = value.map(item => Number(item) || 0);
        if (values.length === 2) {
          const [horizontal, vertical] = values;
          return { top: vertical, right: horizontal, bottom: vertical, left: horizontal };
        }
        const [top = 0, right = 0, bottom = 0, left = 0] = values;
        return { top, right, bottom, left };
      }
      const all = Number(value) || 0;
      return { top: all, right: all, bottom: all, left: all };
    }

    function renderDesignNode(node, parent, offsetX = 0, offsetY = 0, isRoot = false) {
      const copy = { ...node };
      if (isRoot) {
        copy.x = 0;
        copy.y = offsetY;
      } else {
        copy.x = (Number(copy.x) || 0) + offsetX;
        copy.y = (Number(copy.y) || 0) + offsetY;
      }
      return renderNode(copy, parent);
    }

    function walkDesign(node, visit) {
      visit(node);
      (node.children || []).forEach(child => walkDesign(child, visit));
    }

    function indexDesign(doc) {
      nodeById = new Map();
      (doc.children || []).forEach(root => walkDesign(root, node => nodeById.set(node.id, node)));
    }

    function px(value) {
      if (value === undefined || value === null) return undefined;
      if (typeof value === 'number') return value + 'px';
      if (String(value).startsWith('fit_content')) return 'auto';
      return value;
    }

    function applyFill(el, fill, type) {
      if (!fill) return;
      if (typeof fill === 'string') {
        if (type === 'text') el.style.color = fill;
        else el.style.background = fill;
        return;
      }
      const f = Array.isArray(fill) ? fill.find(item => item.enabled !== false) : fill;
      if (!f) return;
      if (f.type === 'image' && f.url) {
        el.style.backgroundImage = `url("${f.url}")`;
        el.style.backgroundRepeat = 'no-repeat';
        el.style.backgroundPosition = 'center';
        el.style.backgroundSize = f.mode === 'fit' ? 'contain' : (f.mode === 'fill' ? 'cover' : '100% 100%');
      } else if (f.type === 'color') {
        el.style.background = f.color;
      } else if (f.type === 'gradient' && f.colors) {
        const colors = f.colors.map(c => `${c.color} ${Math.round((c.position || 0) * 100)}%`).join(', ');
        el.style.background = `linear-gradient(${f.rotation || 180}deg, ${colors})`;
      }
    }

    function applyStroke(el, stroke) {
      if (!stroke) return;
      const fill = typeof stroke.fill === 'string' ? stroke.fill : (stroke.fill && stroke.fill.color) || '#00000000';
      const thickness = typeof stroke.thickness === 'number' ? stroke.thickness : 0;
      if (thickness > 0) el.style.border = `${thickness}px solid ${fill}`;
    }

    function applyEffect(el, effect) {
      if (!effect) return;
      const effects = Array.isArray(effect) ? effect : [effect];
      const shadows = effects.filter(e => e.type === 'shadow' && e.enabled !== false).map(e => {
        const inset = e.shadowType === 'inner' ? 'inset ' : '';
        const off = e.offset || { x: 0, y: 0 };
        return `${inset}${off.x || 0}px ${off.y || 0}px ${e.blur || 0}px ${e.spread || 0}px ${e.color || '#0008'}`;
      });
      if (shadows.length) el.style.boxShadow = shadows.join(', ');
    }

    function applyText(el, node) {
      el.classList.add('text');
      el.textContent = node.content || '';
      el.style.fontFamily = node.fontFamily || 'Microsoft YaHei, SimSun, sans-serif';
      el.style.fontSize = px(node.fontSize || 16);
      el.style.fontWeight = node.fontWeight || '500';
      el.style.lineHeight = node.lineHeight || 1.35;
      if (node.textAlign) el.style.textAlign = node.textAlign;
      if (node.textAlignVertical === 'middle') {
        el.style.display = 'flex';
        el.style.alignItems = 'center';
        el.style.justifyContent = node.textAlign === 'center' ? 'center' : 'flex-start';
      }
    }

    function addHit(node, parent) {
      const hit = document.createElement('button');
      hit.type = 'button';
      hit.className = 'hit';
      hit.setAttribute('aria-label', '交互按钮');
      hit.style.left = px(node.x);
      hit.style.top = px(node.y);
      hit.style.width = px(node.width);
      hit.style.height = px(node.height);
      hit.addEventListener('click', node.action);
      parent.appendChild(hit);
    }

    function renderModal(stage) {
      if (!state.modal) return;
      const layer = document.createElement('div');
      layer.className = 'modal-layer';
      stage.appendChild(layer);
      const realModal = modalSceneIds[state.modal] && nodeById.get(modalSceneIds[state.modal]);
      if (realModal) {
        renderDesignNode(realModal, layer, 200 - (Number(realModal.x) || 0), 270 - (Number(realModal.y) || 0), false);
        addGlobalHit(layer, 200, 270, 640, 560, closeModal, '关闭弹窗');
        addGlobalHit(layer, 655, 700, 110, 55, closeModal, '确认');
        return;
      }
      const modal = imageFrame(200, 270, 640, 560, IMG.modal, { clip: true, children: modalChildren(state.modal) });
      renderNode(modal, layer);
    }

    function modalChildren(kind) {
      if (kind === 'demonImage') return [imageFrame(232, 96, 176, 176, IMG.demonJudge), buttonFrame(455, 430, 110, 45, '确认', closeModal)];
      if (kind === 'legionImage') return [imageFrame(232, 96, 176, 176, IMG.legionJudge), textNode(62, 310, 516, '终焉审判者军团：围绕据点生成，跟随军团波次持续施压。', 20, TEXT, { fontWeight: '500' }), buttonFrame(455, 430, 110, 45, '确认', closeModal)];
      if (kind === 'generalRoster') return [
        rosterCard(35, 130, IMG.general3, '审判天使·加百列'), rosterCard(225, 130, IMG.general1, '天使长·米迦勒'), rosterCard(415, 130, IMG.general5, '末日天使·亚兹拉尔'),
        rosterCard(130, 280, IMG.general2, '守护天使·乌列尔'), rosterCard(320, 280, IMG.general4, '救赎天使·拉斐尔'), buttonFrame(455, 430, 110, 45, '确认', closeModal)
      ];
      return [
        n('rectangle', 82, 68, 476, 328, { fill: '#00000044', cornerRadius: 8, stroke: { thickness: 1, fill: '#A87935' } }),
        textNode(96, 84, 448, '罪孽之眼：敌人每杀 1 人，罪孽就会上升；活得越久，罪孽也会慢慢增加。罪孽很高的敌人会被标记为重罪者，审判者攻击他们时伤害更高。\n\n天罚之锤：审判者会锁定 10 格内的一个敌人，降下审判之锤。目标罪孽越高，受到的伤害越高。\n\n末日审判：审判周围 20 格内的所有敌人。重罪者会被重创，轻罪者会受伤并被削弱，无罪者不会受到伤害。', 20, TEXT, { fontWeight: '500' }),
        buttonFrame(455, 430, 110, 45, '确认', closeModal)
      ];
    }

    function rosterCard(x, y, icon, label) {
      return n('frame', x, y, 190, 150, { fill: '#00000000' }, [
        imageFrame(55, 8, 80, 80, icon),
        textNode(0, 98, 190, label, 17, TEXT, { height: 44, textAlign: 'center', textAlignVertical: 'middle' })
      ]);
    }

    function closeModal() {
      state.modal = null;
      render();
    }

    function render() {
      const stage = document.getElementById('stage');
      stage.textContent = '';
      if (renderFromDesign(stage)) return;
      layoutBase().forEach(node => renderNode(node, stage));
      renderModal(stage);
      addTopHits(stage);
    }

    function currentSceneId() {
      const sys = state.system;
      const page = state.pages[sys];
      return sceneIds[sys] && sceneIds[sys][page];
    }

    function currentSceneOffsetY() {
      if (state.system === 'demon' && state.pages.demon === 'params') return longSceneOffsets.demon[state.demonParam] || 0;
      if (state.system === 'legion' && state.pages.legion === 'params') return longSceneOffsets.legion[state.legionParam] || 0;
      return 0;
    }

    function renderFromDesign(stage) {
      if (!designDoc) return false;
      const scene = nodeById.get(currentSceneId());
      if (!scene) return false;
      renderDesignNode(scene, stage, 0, currentSceneOffsetY(), true);
      renderFixedLongSceneNav(stage, scene);
      addTopHits(stage);
      addInnerHits(stage);
      addCodexHits(stage);
      renderModal(stage);
      return true;
    }

    function renderFixedLongSceneNav(stage, scene) {
      if (!((state.system === 'demon' && state.pages.demon === 'params') || (state.system === 'legion' && state.pages.legion === 'params'))) return;
      (scene.children || [])
        .filter(child => child.type === 'frame' && /入口/.test(child.name || '') && Number(child.x) < 160)
        .forEach(child => renderDesignNode(child, stage, 0, 0, false));
    }

    function addInnerHits(stage) {
      if (state.system === 'demon' && state.pages.demon === 'params') {
        demonParamTabs.forEach(([key]) => {
          const rect = demonParamHitRects[key];
          if (rect) addGlobalHit(stage, rect[0], rect[1], rect[2], rect[3], () => { state.demonParam = key; state.modal = null; render(); }, '魔王参数切换');
        });
      }
      if (state.system === 'legion' && state.pages.legion === 'params') {
        legionParamTabs.forEach(([key]) => {
          const rect = legionParamHitRects[key];
          if (rect) addGlobalHit(stage, rect[0], rect[1], rect[2], rect[3], () => { state.legionParam = key; state.modal = null; render(); }, '军团参数切换');
        });
      }
    }

    function addCodexHits(stage) {
      if (state.system === 'demon' && state.pages.demon === 'codex') {
        for (let i = 0; i < 10; i += 1) {
          const y = 350 + i * 58;
          addGlobalHit(stage, 520, y, 66, 48, () => { state.modal = 'demonImage'; render(); }, '魔王图片弹窗');
          addGlobalHit(stage, 596, y, 92, 48, () => { state.modal = 'demonSkill'; render(); }, '魔王技能弹窗');
        }
      }
      if (state.system === 'general' && state.pages.general === 'codex') {
        for (let i = 0; i < 10; i += 1) addGlobalHit(stage, 581, 350 + i * 58, 92, 48, () => { state.modal = 'generalRoster'; render(); }, '将领名册弹窗');
      }
      if (state.system === 'legion' && state.pages.legion === 'codex') {
        for (let i = 0; i < 5; i += 1) addGlobalHit(stage, 554, 350 + i * 82, 110, 56, () => { state.modal = 'legionImage'; render(); }, '军团详情弹窗');
      }
    }

    function addTopHits(stage) {
      systems.forEach(([key], i) => addGlobalHit(stage, 101, 389 + i * 90, 90, 90, () => { state.system = key; state.modal = null; render(); }));
      const sys = state.system;
      const items = pageLabels[sys];
      const startX = sys === 'guide' ? 407 : 301;
      const step = sys === 'guide' ? 88 : 100;
      items.forEach(([key], i) => addGlobalHit(stage, 178 + 59 + (sys === 'guide' ? 229 : 123) + i * step, 79 + 95 + 27, 88, 58, () => { state.pages[sys] = key; state.modal = null; render(); }));
    }

    function addGlobalHit(parent, x, y, width, height, action, label = '切换按钮') {
      const hit = document.createElement('button');
      hit.type = 'button';
      hit.className = 'hit';
      hit.setAttribute('aria-label', label);
      hit.style.left = px(x);
      hit.style.top = px(y);
      hit.style.width = px(width);
      hit.style.height = px(height);
      hit.addEventListener('click', action);
      parent.appendChild(hit);
    }

    function fit() {
      const scale = Math.min(window.innerWidth / 1040, window.innerHeight / 1100);
      document.documentElement.style.setProperty('--scale', Math.max(0.2, scale).toFixed(4));
    }

    window.addEventListener('resize', fit);
    async function boot() {
      fit();
      try {
        const embedded = document.getElementById('design-data');
        if (embedded && embedded.textContent.trim()) {
          designDoc = JSON.parse(embedded.textContent);
        } else {
          throw new Error('missing embedded design-data');
        }
        indexDesign(designDoc);
      } catch (error) {
        jsonLoadError = error;
        console.warn('Unable to read embedded design-data; using fallback UI.', error);
      }
      render();
    }
    boot();
  </script>
</body>
</html>
